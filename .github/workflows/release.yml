name: Build and publish latest

on:
  push:
    branches: [main]
    paths:
      - 'rusttran/**'
      - 'analysis/data/**'
      - 'analysis/*_fixtures.json'
      - 'scripts/install-linux.sh'
      - 'scripts/package_release*.py'
      - 'scripts/test_release_installer.py'
      - 'packaging/**'
      - 'install.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          python -m pip install cargo-zigbuild==0.23.4 ziglang==0.17.0
      - name: Test recovered engine and installer
        run: |
          cargo test --locked --manifest-path rusttran/Cargo.toml --features gui
          python scripts/test_release_installer.py
      - name: Build Linux with glibc 2.28 compatibility
        run: cargo zigbuild --locked --manifest-path rusttran/Cargo.toml --release --features gui --bins --target x86_64-unknown-linux-gnu.2.28
      - name: Package Linux
        run: |
          python scripts/package_release.py --target x86_64-unknown-linux-gnu
          python scripts/package_release_assets.py --platform linux
          dist/rusttran-linux-x86_64/rusttran-cli --help
          bash -n install.sh scripts/install-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 3

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build portable Windows executables
        run: cargo build --locked --manifest-path rusttran/Cargo.toml --release --features gui --bins --target x86_64-pc-windows-msvc
      - name: Smoke-test Windows CLI and package
        shell: pwsh
        run: |
          & rusttran/target/x86_64-pc-windows-msvc/release/rusttran-cli.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_release_assets.py --platform windows --windows-target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist/release-assets
      - name: Verify asset set and publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          folder=Path('dist/release-assets')
          required=['rusttran-linux-x86_64.tar.gz','RustTran.exe','RustTran-cli.exe','rusttran-windows-x86_64.zip','install.sh','BUILD_INFO.json']
          assert all((folder/name).is_file() for name in required)
          assert list(folder.glob('rusttran_*_amd64.deb'))
          (folder/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(folder.iterdir()) if path.is_file() and path.name!='SHA256SUMS'))
          PY
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > /tmp/rusttran-release-notes.md <<EOF_NOTES
          Built from commit ${GITHUB_SHA}.

          Linux x86_64: install/update with the command in the repository README. The installer uses the latest successfully published release, verifies SHA-256 and adds the Plasma/GNOME menu icon.

          Windows x86_64: download RustTran.exe or rusttran-windows-x86_64.zip.

          This remains a partial PCTran reconstruction. Complete original scenario equivalence has not been validated.
          EOF_NOTES
          gh release create "$tag" dist/release-assets/* --target "$GITHUB_SHA" --title "RustTran build ${GITHUB_RUN_NUMBER}" --notes-file /tmp/rusttran-release-notes.md --latest
