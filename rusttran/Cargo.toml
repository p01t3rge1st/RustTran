[package]
name = "rusttran"
version = "0.1.0"
edition = "2024"
default-run = "rusttran-cli"
description = "RustTran PWR 3LP desktop application and recovered numerical helpers"

[dependencies]
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
default = []
gui = ["dep:eframe"]
gui-screenshot = ["gui", "dep:image"]

[dependencies.eframe]
version = "=0.33.3"
optional = true
default-features = false
features = ["default_fonts", "glow", "x11", "wayland"]

[[bin]]
name = "rusttran-cli"
path = "src/main.rs"

[[bin]]
name = "rusttran"
path = "src/gui.rs"
required-features = ["gui"]

[dependencies.image]
version = "=0.25.10"
optional = true
default-features = false
features = ["png"]

[build-dependencies]
winresource = "=0.1.34"
